# Pagina di stato di BresciaPedala (https://bresciapedala.duckdns.org)
# Docs: https://upptime.js.org/docs/configuration
owner: robertostefana
repo: bresciapedala-status
user-agent: bresciapedala-status

assignees:
  - robertostefana

# Ogni controllo e' "su" se risponde 2xx/3xx; gli endpoint /api/status/* rispondono 503 quando il componente non funziona.
sites:
  - name: Sito
    url: https://bresciapedala.duckdns.org/
  - name: API
    url: https://bresciapedala.duckdns.org/api/health
  - name: Database
    url: https://bresciapedala.duckdns.org/api/status/db
  - name: Mappa
    url: https://bresciapedala.duckdns.org/api/status/tiles
  - name: Dati OSM
    url: https://bresciapedala.duckdns.org/api/status/overpass
  - name: Ricerca luoghi
    url: https://bresciapedala.duckdns.org/api/status/geocoder
  - name: Email
    url: https://bresciapedala.duckdns.org/api/status/mail
  - name: Backup
    url: https://bresciapedala.duckdns.org/api/status/backup

status-website:
  baseUrl: /bresciapedala-status
  name: BresciaPedala
  introTitle: "**BresciaPedala**"
  introMessage: Stato dei servizi di BresciaPedala, aggiornato ogni 5 minuti.
  navbar:
    - title: Stato
      href: https://robertostefana.github.io/bresciapedala-status/
    - title: BresciaPedala
      href: https://bresciapedala.duckdns.org

